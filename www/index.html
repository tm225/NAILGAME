<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma tablette magique</title>
<style>
:root{--bg:#dff3e3;--frame:#3fbf3f;--screen:#1f2430;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10261a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.tab{width:min(100vw,calc(100vh*1.35));height:min(100%,calc(100vw/1.2));max-height:100%;background:var(--frame);border-radius:28px;padding:12px;box-shadow:0 8px 0 #2b8f2b}
.scr{height:100%;background:var(--screen);border-radius:18px;padding:8px;display:grid;gap:7px;grid-template-rows:auto auto 1fr}
.row{display:grid;gap:7px;min-height:0}
.r1{grid-template-columns:repeat(4,1fr)}
.r2{grid-template-columns:repeat(6,1fr)}
.r3{grid-template-columns:repeat(6,1fr)}
.r4{grid-template-columns:repeat(6,1fr)}
.r5{grid-template-columns:repeat(10,1fr)}
button{border:0;border-radius:14px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;min-width:0;padding:2px;color:#222;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
button:active,button.on{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(1.15)}
button:focus-visible{outline:3px solid #fff}
.e{font-size:clamp(22px,6.5vmin,70px);line-height:1}
.big .e{font-size:clamp(34px,11vmin,110px)}
.l{font-size:clamp(10px,2.4vmin,22px);font-weight:700;margin-top:1px}
.num{font-size:clamp(20px,6vmin,56px);font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.num .e{font-size:clamp(14px,3.6vmin,36px)}
.t{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:800;font-size:clamp(18px,5vmin,48px);letter-spacing:.04em;line-height:1.15;padding:2px 0;text-shadow:0 3px 0 rgba(0,0,0,.45);cursor:pointer}
.t span{display:inline-block;animation:pop .6s backwards cubic-bezier(.3,1.6,.5,1),wave 1.6s ease-in-out infinite}
.t::before,.t::after{content:"⭐";display:inline-block;margin:0 .45em;animation:spin 3s linear infinite}
@keyframes pop{from{transform:translateY(-160%) scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.28em) rotate(-7deg) scale(1.15)}60%{transform:translateY(0) rotate(5deg)}}
@keyframes spin{to{transform:rotate(360deg) scale(1)}}
@media (prefers-reduced-motion:reduce){button{transition:none}.t span,.t::before,.t::after{animation:none}}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.tb{background:#39425a;color:#fff;padding:3px 0;border-radius:12px}
.tb .e{font-size:clamp(16px,3.8vmin,36px)}.tb .l{font-size:clamp(8px,1.9vmin,16px);color:#fff}
.tb.sel{background:#fff;color:#222;transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}.tb.sel .l{color:#222}
.pg{display:grid;gap:7px;min-height:0;grid-template-columns:repeat(var(--c),1fr);grid-auto-rows:1fr}
.pg .e{font-size:clamp(24px,7.5vmin,84px)}.pg .l{font-size:clamp(11px,2.6vmin,24px)}
</style></head><body>
<div class="tab"><div class="scr" id="s"></div></div>
<script>
var AC=null;
function ctx(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,to,vol,at,lp){var c=ctx(),t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain(),n=c.destination;
 if(lp){var fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;fl.connect(n);n=fl}
 o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(n);o.start(t);o.stop(t+d+0.05)}
function noise(d,f0,f1,vol,at){var c=ctx(),t=c.currentTime+(at||0),b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);
 for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;var s=c.createBufferSource();s.buffer=b;
 var fl=c.createBiquadFilter();fl.type="bandpass";fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
 var g=c.createGain();g.gain.setValueAtTime(vol||0.4,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t)}
var S={
 chat:function(){tone(500,.18,"sawtooth",900,.25,0,1800);tone(900,.45,"sawtooth",450,.25,.18,1800)},
 chien:function(){[0,.3].forEach(function(a){tone(320,.2,"sawtooth",140,.4,a,1200);noise(.1,900,300,.3,a)})},
 canard:function(){[0,.35].forEach(function(a){tone(520,.25,"sawtooth",380,.3,a,1500);tone(540,.25,"square",400,.1,a,1500)})},
 vache:function(){tone(140,1.1,"sawtooth",105,.45,0,500);tone(280,1.1,"sawtooth",210,.1,0,500)},
 "éléphant":function(){tone(250,.9,"sawtooth",700,.35,0,2500);tone(700,.5,"sawtooth",420,.3,.9,2500)},
 singe:function(){[0,.22,.5,.72].forEach(function(a,i){tone(i<2?700:500,.16,"square",i<2?900:420,.18,a,2200)})},
 piano:function(){[262,330,392,523].forEach(function(f,i){tone(f,1,"triangle",0,.3,i*.12)})},
 guitare:function(){[196,247,294,392].forEach(function(f,i){tone(f,.9,"triangle",f*.99,.3,i*.09,1800)})},
 violon:function(){[440,494,523].forEach(function(f,i){tone(f,.5,"sawtooth",f*1.01,.18,i*.4,1600)})},
 saxophone:function(){[220,262,196].forEach(function(f,i){tone(f,.5,"square",f*.98,.18,i*.45,900)})},
 voiture:function(){tone(420,.25,"square",0,.2,0,1500);tone(420,.25,"square",0,.2,.35,1500)},
 avion:function(){noise(2.2,300,1800,.5,0);tone(90,2,"sawtooth",200,.15,0,500)},
 train:function(){for(var i=0;i<6;i++)noise(.12,500,200,.45,i*.22);tone(520,.7,"triangle",0,.25,1.4,1200);tone(660,.7,"triangle",0,.25,1.4,1200)},
 bateau:function(){tone(150,1.2,"sawtooth",140,.4,0,400);tone(225,1.2,"sawtooth",210,.2,0,400)},
 lion:function(){tone(180,.9,"sawtooth",90,.45,0,700);noise(.8,300,100,.3,0)},
 cheval:function(){tone(500,.2,"sawtooth",900,.3,0,2000);tone(900,.5,"sawtooth",400,.3,.2,2000);tone(400,.15,"square",0,.2,.7,1500)},
 mouton:function(){tone(380,.7,"sawtooth",340,.25,0,1400);tone(392,.7,"square",350,.1,0,1400)},
 cochon:function(){[0,.3].forEach(function(a){noise(.2,400,200,.4,a);tone(160,.2,"sawtooth",120,.4,a,600)})},
 poule:function(){[0,.15,.3,.7].forEach(function(a){tone(900,.08,"square",700,.2,a,2500)})},
 grenouille:function(){[0,.3].forEach(function(a){tone(120,.2,"square",180,.3,a,500)})},
 tambour:function(){[0,.25,.5,.65].forEach(function(a){noise(.12,200,100,.6,a);tone(150,.12,"sine",70,.5,a)})},
 ambulance:function(){[0,.4,.8,1.2].forEach(function(a,i){tone(i%2?900:700,.4,"sine",0,.3,a)})},
 defaut:function(i){tone(i||523,.4,"sine",0,.3)}
};
